[project]
name = "fuzzy-engine"
version = "0.1.0"
description = "RAG Patch Training for FLUX DiT correction stream"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # Core ML packages (torch, transformers, etc.) provided by container

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_patch_training"]

[project.optional-dependencies]
train = [
    "peft>=0.15.2",
    "lightning>=2.6.1",
    "pytorch-lightning>=2.6.1",
    "deepspeed>=0.18.2",
    "torchmetrics>=1.8.2",
    "torchvision>=0.19.0",
    "datasets>=4.4.1",
    "transformers>=4.49.0",
    "accelerate>=1.11.0",
    "safetensors>=0.6.2",
    "einops>=0.8.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "pillow>=11.3.0",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ipykernel>=6.29.5",
]

[tool.uv]
no-build-isolation-package = ["deepspeed"]

[tool.ruff]
line-length = 120
