[project]
name = "fuzzy-engine"
version = "0.1.0"
description = "Nexus-Gen multimodal generation and retrieval project"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Build tools needed by DiffSynth-Studio's legacy setup.py
    # (setuptools>=74 dropped pkg_resources; wheel must be explicit)
    "wheel",
    "setuptools<74",

    # NOTE: DiffSynth-Studio is NOT listed here because its legacy setup.py
    # cannot be resolved by uv lock. Install it manually after uv sync:
    #   uv pip install -e /path/to/DiffSynth-Studio --no-build-isolation
    # See setup_nexus_uv.sh for the automated flow.

    # PyTorch ecosystem (served from the pytorch-cu121 index via [tool.uv.sources])
    "torch==2.4.0",
    "torchvision==0.19.0",
    "torchaudio==2.4.0",
    "torchmetrics==1.8.2",
    "pytorch-lightning==2.6.1",
    "lightning==2.6.1",
    "lightning-utilities==0.15.2",

    # CUDA-compiled packages that must be installed after torch
    # flash-attn is listed here but requires --no-build-isolation (see [tool.uv] below)
    "flash-attn==2.8.3",
    "deepspeed==0.18.2",
    "bitsandbytes==0.48.2",

    # faiss with CUDA 12 native binaries (replaces faiss-gpu==1.7.2 from PyPI)
    "faiss-gpu-cu12",

    # DiffSynth-Studio: installed separately via setup_nexus_uv.sh
    # (legacy setup.py cannot pass uv lock-time metadata resolution)
    # "diffsynth",

    # Transformers / HuggingFace ecosystem
    "transformers==4.49.0",
    "tokenizers==0.21.4",
    "accelerate==1.11.0",
    "peft==0.15.2",
    "datasets==4.4.1",
    "huggingface-hub==0.36.0",
    "safetensors==0.6.2",
    "trl==0.16.1",
    "transformers-stream-generator==0.0.5",
    "qwen-vl-utils==0.0.6",
    "ms-swift==3.3.0",
    "modelscope==1.19.1",

    # Vision / media
    "pillow==11.3.0",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "av==16.0.1",
    "ffmpy==1.0.0",
    "pydub==0.25.1",

    # Scientific computing
    "numpy==1.26.4",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "einops==0.8.1",
    "sympy==1.14.0",
    "networkx==3.4.2",
    "pyarrow==22.0.0",

    # API / web
    "fastapi==0.121.2",
    "starlette==0.49.3",
    "uvicorn==0.38.0",
    "gradio==5.49.1",
    "gradio-client==1.13.3",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "aiohttp==3.13.2",
    "aiofiles==24.1.0",
    "anyio==4.12.1",
    "websockets==15.0.1",
    "openai==2.8.1",

    # Data / serialisation
    "pydantic==2.11.10",
    "pydantic-core==2.33.2",
    "orjson==3.11.4",
    "msgpack==1.1.2",
    "simplejson==3.20.2",
    "xxhash==3.6.0",
    "zstandard==0.25.0",
    "dill==0.4.0",
    "dacite==1.9.2",
    "addict==2.4.0",

    # NLP utilities
    "tiktoken==0.12.0",
    "sentencepiece==0.2.1",
    "ftfy==6.3.1",
    "nltk==3.9.2",
    "jieba==0.42.1",
    "rouge==1.0.1",
    "regex==2025.11.3",

    # Training utilities
    "tensorboard==2.20.0",
    "tensorboard-data-server==0.7.2",

    # Cloud / storage
    "oss2==2.19.1",
    "aliyun-python-sdk-core==2.16.0",
    "aliyun-python-sdk-kms==2.16.5",
    "cryptography==46.0.3",

    # CLI / output
    "typer==0.24.1",
    "typer-slim==0.24.0",
    "rich==14.3.3",
    "click==8.3.1",
    "tqdm==4.67.3",
    "gradio==5.49.1",

    # Misc utilities
    "psutil==7.1.3",
    "packaging==25.0",
    "filelock==3.24.3",
    # fsspec is intentionally unpinned: datasets==4.4.1 requires <=2025.10.0,
    # while requirements.txt had 2026.2.0 (a pip-freeze artifact from torch).
    # Let the resolver pick a compatible version.
    "requests==2.32.5",
    "certifi==2025.11.12",
    "urllib3==2.5.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "tzdata==2025.2",
    "pyyaml==6.0.3",
    "tomlkit==0.13.3",
    "jinja2==3.1.6",
    "joblib==1.5.2",
    "sortedcontainers==2.4.0",
    "absl-py==2.3.1",
    "attrs==25.4.0",
    "binpacking==1.5.2",
    "cpm-kernels==1.0.11",
    "crcmod==1.7",
    "distro==1.9.0",
    "future==1.0.0",
    "groovy==0.1.2",
    "grpcio==1.76.0",
    "hjson==3.1.0",
    "importlib-metadata==8.7.0",
    "jiter==0.12.0",
    "jmespath==0.10.0",
    "markdown==3.10",
    "mpmath==1.3.0",
    "multiprocess==0.70.18",
    "ninja==1.13.0",
    "nvidia-ml-py==13.580.82",
    "pynvml==13.0.1",
    "py-cpuinfo==9.0.0",
    "pycparser==2.23",
    "pycryptodome==3.23.0",
    "python-multipart==0.0.20",
    "safehttpx==0.1.7",
    "semantic-version==2.10.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sniffio==1.3.1",
    "threadpoolctl==3.6.0",
    "Werkzeug==3.1.3",
    "attrdict==2.0.1",
    "annotated-doc==0.0.4",

    # Dev / linting
    "ruff==0.14.5",
]

[tool.uv]
# PyTorch wheels are only on the pytorch index; other packages fall back to PyPI
index-strategy = "unsafe-best-match"
# flash-attn must be built in-tree (needs torch headers already present)
# diffsynth's setup.py uses pkg_resources which requires no-build-isolation
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
# Pin torch/torchvision/torchaudio to the CUDA 12.1 index
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]
# DiffSynth-Studio is installed separately (see setup_nexus_uv.sh) because its
# legacy setup.py cannot pass uv's lock-time metadata resolution.
# Reference: git+https://github.com/modelscope/DiffSynth-Studio.git@afd101f3452c9ecae0c87b79adfa2e22d65ffdc3
